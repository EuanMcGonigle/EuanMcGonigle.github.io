<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != "" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.author.bio | strip_html | strip }}">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.author.bio }}">
  <meta property="og:image" content="{{ site.url }}/images/euan-portrait.jpg">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <link rel="icon" href="{{ '/images/euan-portrait.jpg' | relative_url }}">
  <script>
    // Apply saved theme before paint to avoid a flash.
    document.documentElement.classList.add('js');
    // If modern.js fails to load, show content instead of leaving it hidden.
    setTimeout(function () { if (!window.__modernReady) document.documentElement.classList.remove('js'); }, 2500);
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/modern.css' | relative_url }}">
</head>
<body class="{% if page.hero %}has-hero{% endif %}">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="nav" id="nav">
    <div class="nav__inner">
      <a class="nav__brand" href="{{ '/' | relative_url }}">
        <span class="nav__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M2 15 L6 15 L6 9 L11 9 L11 17 L15 17 L15 6 L19 6 L19 12 L22 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
        </span>
        Euan McGonigle
      </a>
      <nav class="nav__links" id="nav-links" aria-label="Main">
        {% assign home = '/' | relative_url %}
        <a href="{{ home }}#about" data-section="about">About</a>
        <a href="{{ home }}#research" data-section="research">Research</a>
        <a href="{{ '/publications/' | relative_url }}" data-section="publications">Publications</a>
        <a href="{{ '/software/' | relative_url }}" data-section="software">Software</a>
        <a href="{{ '/teaching/' | relative_url }}" data-section="teaching">Teaching</a>
      </nav>
      <div class="nav__actions">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode">
          <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
          <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn nav__burger" id="nav-burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links">
          <span></span><span></span>
        </button>
      </div>
    </div>
    <div class="nav__progress" id="nav-progress" aria-hidden="true"></div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="footer">
    <div class="wrap footer__inner">
      <p>© {{ site.time | date: "%Y" }} Euan McGonigle · School of Mathematical Sciences, University of Southampton</p>
      <p class="footer__links">
        <a href="https://github.com/EuanMcGonigle">GitHub</a>
        <a href="https://orcid.org/0000-0003-0902-0035">ORCID</a>
        <a href="https://www.researchgate.net/profile/Euan_Mcgonigle">ResearchGate</a>
      </p>
    </div>
  </footer>

  <script src="{{ '/assets/js/modern.js' | relative_url }}" defer></script>
</body>
</html>
