<section class="hero" id="top">
  <div class="wrap hero__inner">
    <div class="hero__text">
      <p class="eyebrow reveal">Lecturer in Statistics · University of Southampton</p>
      <h1 class="hero__title reveal">Euan McGonigle</h1>
      <p class="hero__lede reveal">
        My research focuses on <span class="sr-only">nonstationary time series, change point detection, nonparametric methods and wavelet methods.</span><span aria-hidden="true"><span class="typer" id="typer" data-words="nonstationary time series|change point detection|nonparametric methods|wavelet methods">nonstationary time series</span><span class="typer__caret"></span></span>
      </p>
      <div class="hero__cta reveal">
        <a class="btn btn--solid" href="{{ '/publications/' | relative_url }}">Publications</a>
        <a class="btn" href="#contact">Get in touch</a>
      </div>
      <div class="reveal" style="--d:1">{% include modern/profile-icons.html %}</div>
    </div>
    <figure class="hero__portrait reveal">
      <div class="portrait">
        <img src="{{ '/images/euan-portrait.jpg' | relative_url }}" srcset="{{ '/images/euan-portrait-360.jpg' | relative_url }} 360w, {{ '/images/euan-portrait.jpg' | relative_url }} 640w" sizes="(max-width: 860px) 150px, 340px" alt="Portrait of Euan McGonigle" width="640" height="640" fetchpriority="high">
      </div>
    </figure>
  </div>
  <div class="hero__band" aria-hidden="true"><canvas id="hero-live"></canvas></div>
</section>
<script src="{{ '/assets/js/hero-anim.js' | relative_url }}" defer></script>
